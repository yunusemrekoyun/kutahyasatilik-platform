name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: kutahya_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/kutahya_test?sslmode=disable
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/kutahya_test?sslmode=disable
      NEXT_PUBLIC_SITE_URL: https://kutahyasatilik.com
      PUSH_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Scan full Git history for secrets
        shell: bash
        run: gitleaks git . --log-opts=--all --redact=100 --no-banner --exit-code=1 --log-level=warn
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm run check:secrets
      - name: Prepare ephemeral CI secrets
        shell: bash
        run: |
          set +x
          generated_value="$(openssl rand -hex 64)"
          printf '::add-mask::%s\n' "$generated_value"
          printf 'AUTH_SECRET=%s\n' "$generated_value" >> "$GITHUB_ENV"
          unset generated_value
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:runtime
      - run: npm run build
      # prepare:standalone ATLANIYORDU: check:standalone'un "public/uploads
      # standalone çıktısına kopyalanmasın" kuralı, .next/standalone/public
      # henüz oluşmadığı için CI'da fiilen no-op çalışıyordu. Kural ancak
      # DEPLOY.md'deki build -> prepare -> check sırasıyla anlam kazanıyor.
      - run: npm run prepare:standalone
      - run: npm run check:standalone
      # e2e VERİLİ veritabanına koşmalı. Eskiden yalnız migrate çalışıyordu ve
      # tablolar boştu: ilan detay sayfası CI'da hiç render edilmiyordu, çünkü
      # design.spec "ilan bağlantısı varsa detaya git" diye koşullu ilerliyor.
      # Boş DB'de sessizce "sonuç bulunamadı" dalına düşüp yeşil geçiyordu, yani
      # ilan detayını bozan bir değişiklik CI'dan geçebiliyordu.
      # Demo katalog (seed:demo) burada kullanılamaz: 977 görseli Wikimedia'dan
      # indiriyor. Temel seed ağa çıkmıyor ve birkaç saniyede bitiyor.
      - name: Seed e2e fixtures
        shell: bash
        run: |
          set +x
          # Tırnaksız komut ikamesi bilinçli: check:secrets "$" ile başlayan
          # değeri dinamik sayıyor, tırnakla başlayanı sabit atama sanıp
          # yanlış alarm veriyor. Değer zaten her koşuda yeniden üretiliyor.
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          export ADMIN_PASSWORD
          npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
