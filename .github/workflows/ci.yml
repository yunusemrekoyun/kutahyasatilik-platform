name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Aynı dal için yeni push gelince eskisini iptal et: süperse olmuş bir koşuyu
# sonuna kadar beklemek hem dakika yakıyor hem geri bildirimi geciktiriyor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Asılı kalan bir iş 6 saat boyunca runner tutmasın.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: kutahya_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/kutahya_test?sslmode=disable
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/kutahya_test?sslmode=disable
      NEXT_PUBLIC_SITE_URL: https://kutahyasatilik.com
      PUSH_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Scan full Git history for secrets
        shell: bash
        run: gitleaks git . --log-opts=--all --redact=100 --no-banner --exit-code=1 --log-level=warn
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm run check:secrets
      - name: Prepare ephemeral CI secrets
        shell: bash
        run: |
          set +x
          generated_value="$(openssl rand -hex 64)"
          printf '::add-mask::%s\n' "$generated_value"
          printf 'AUTH_SECRET=%s\n' "$generated_value" >> "$GITHUB_ENV"
          unset generated_value
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Bağımlılık denetimi YALNIZ bağımlılık değiştiğinde bloklar.
      #
      # Her push'ta koşarken, dışarıda yeni bir uyarı yayımlandığı an alakasız
      # bir commit kırmızıya düşüyordu (bu tam olarak yaşandı: deepmerge-ts
      # uyarısı, kodla hiç ilgisi olmayan bir commit'i blokladı). Kendi
      # eklediğiniz paket burada anında yakalanır; dünyanın kayması haftalık
      # Bakım iş akışında gündeme gelir.
      - name: Bağımlılık dosyaları değişti mi
        id: deps
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # HEAD~1 DEĞİL: tek push'ta üç commit gelirse HEAD~1 yalnız sonuncuya
            # bakar, ortadaki package.json değişikliği denetimden kaçardı.
            # github.event.before, push'tan önceki uç — aradaki her commit kapsanır.
            base="${{ github.event.before }}"
          fi
          # Kıyas noktası yoksa (yeni dal, sıfır SHA, erişilemeyen commit)
          # denetimi atlamak yerine çalıştır.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(package\.json|package-lock\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bağımlılık güvenlik denetimi
        if: steps.deps.outputs.changed == 'true'
        run: npm run audit:runtime
      - run: npm run build
      # prepare:standalone ATLANIYORDU: check:standalone'un "public/uploads
      # standalone çıktısına kopyalanmasın" kuralı, .next/standalone/public
      # henüz oluşmadığı için CI'da fiilen no-op çalışıyordu. Kural ancak
      # DEPLOY.md'deki build -> prepare -> check sırasıyla anlam kazanıyor.
      - run: npm run prepare:standalone
      - run: npm run check:standalone
      # e2e VERİLİ veritabanına koşmalı. Eskiden yalnız migrate çalışıyordu ve
      # tablolar boştu: ilan detay sayfası CI'da hiç render edilmiyordu, çünkü
      # design.spec "ilan bağlantısı varsa detaya git" diye koşullu ilerliyor.
      # Boş DB'de sessizce "sonuç bulunamadı" dalına düşüp yeşil geçiyordu, yani
      # ilan detayını bozan bir değişiklik CI'dan geçebiliyordu.
      # Demo katalog (seed:demo) burada kullanılamaz: 977 görseli Wikimedia'dan
      # indiriyor. Temel seed ağa çıkmıyor ve birkaç saniyede bitiyor.
      - name: Seed e2e fixtures
        shell: bash
        run: |
          set +x
          # Tırnaksız komut ikamesi bilinçli: check:secrets "$" ile başlayan
          # değeri dinamik sayıyor, tırnakla başlayanı sabit atama sanıp
          # yanlış alarm veriyor. Değer zaten her koşuda yeniden üretiliyor.
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          export ADMIN_PASSWORD
          npm run seed
      # Playwright kurulumu İKİYE BÖLÜNDÜ ve sınırlandı.
      #
      # NEDEN: `playwright install --with-deps` iki iş yapıyor — tarayıcıyı
      # indirmek ve sistem kütüphanelerini apt ile kurmak. apt tarafı bir
      # aynaya takıldığında adım sessizce dakikalarca asılı kalıyor; koşu
      # 31 dakikada iş seviyesindeki timeout'a çarpıp "cancelled" olarak
      # düşüyordu. Aynı adım 1.5 saat önce 3 dakikada bitmişti, yani kodla
      # ilgisi yok. Tek atışlık, sınırsız bir adım bu farkı okunaksız kılıyordu.
      #
      # Artık: tarayıcı ikilisi ÖNBELLEKTE (çoğu koşuda indirme hiç olmuyor),
      # her iki adımın kendi süre sınırı var ve hangisinin takıldığı loglarda
      # doğrudan görünüyor.
      - name: Playwright tarayıcı önbelleği
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright sistem bağımlılıkları
        timeout-minutes: 6
        run: npx playwright install-deps chromium
      - name: Playwright tarayıcısı
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install chromium
      - run: npm run test:e2e
